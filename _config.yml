# syntax highlighter
markdown: kramdown
highlighter: rouge
permalink: /:title

# Choose what to show ( can be true or false)
show_author_work_experiences: true
show_author_education_details: false
show_author_project_details: false

# pagination of posts
paginate: 6
per_page: 6
paginate_path: "/blog/page/:num/"

# minify
# compress_html:
#   clippings: all
#   comments: ["<!-- ", " -->"]
#   endings: all
#   ignore:
#     envs: ['development']

# Archives
# jekyll-archives:
#   enabled:
#     - categories
#   layout: archive
#   permalinks:
#     category: '/category/:name/'

collections:
  products:
    output: false
  authors:
    output: false

defaults:
  - scope:
      path: "assets/**"
    values:
      sitemap: false

# Build settings
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-sitemap

# Performance optimizations
incremental: true
profile: true
liquid:
  error_mode: warn
  strict_filters: false
  strict_variables: false

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.

### Switching Deployment Strategy (in DEPLOY_STRATEGY) file change the key accordingly:
# none - For no default
# gh-pages - For Github Pages
# firebase - For Firebase Hosting

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  # Post-generation tool (kept in repo, but never served)
  - generation/
  # Docker/build files copied as static assets otherwise
  - Dockerfile
  - DockerfileOptimized
  - docker-compose.yml
  - .dockerignore
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - readme.md
  # Exclude all documentation and changelog files from bower_components
  - assets/bower_components/**/*.md
  - assets/bower_components/**/*.txt
  - assets/bower_components/**/README*
  - assets/bower_components/**/CHANGELOG*
  - assets/bower_components/**/changelog*
  - assets/bower_components/**/ChangeLog*
  - assets/bower_components/**/LICENSE*
  - assets/bower_components/**/CONTRIBUTING*
  - assets/bower_components/**/example/
  - assets/bower_components/**/examples/
  - assets/bower_components/**/test/
  - assets/bower_components/**/tests/
  - assets/bower_components/**/docs/
  - assets/bower_components/**/doc/

destination: ./build
