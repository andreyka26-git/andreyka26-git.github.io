<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Title, description, canonical, Open Graph, Twitter cards and JSON-LD -->
  {% seo %}

  <!-- Social share image fallback (posts use `thumbnail`, which jekyll-seo-tag does not read) -->
  {% unless page.image %}
  {% if page.thumbnail %}
  <meta content="{{ site.url }}{{ page.thumbnail }}" property="og:image" />
  <meta name="twitter:image" content="{{ site.url }}{{ page.thumbnail }}" />
  {% else %}
  <meta content="{{ site.url }}{{ site.baseurl }}/assets/img/{{ site.author_logo }}" property="og:image" />
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/{{ site.author_logo }}" />
  {% endif %}
  {% endunless %}

  <meta name="keywords" content="{% if page.title %}{{ page.title }}, {{ site.title }}, {% for categ in page.categories %}{{ categ }}{% if forloop.last == false %}, {% endif %}{% endfor %}{% else %}{{ site.title }}, {% for category in site.categories %}{% capture categories_slug %}{{ category | first }}{% endcapture %}{% for categ in categories_slug %}{{ categ }}{% endfor %}{% if forloop.last == false %}, {% endif %}{% endfor %}{% endif %},{{ page.keywords | escape }}"/>

  <link
    rel="alternate"
    type="application/rss+xml"
    title="RSS"
    href="/feed.xml"
  />
  <meta content="{{ site.share.fb_appid }}" property="fb:app_id" />
  {% if page.noindex %}
  <meta name="robots" content="noindex" />
  {% endif %}

  <!-- Block AI training and crawling -->
  <meta name="robots" content="noai, noimageai" />
  <meta name="googlebot" content="noai, noimageai" />
  <meta name="bingbot" content="noai, noimageai" />

  <!-- Speed up Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="{{site.url}}{{site.baseurl}}/assets/css/main.css" />
  <!-- <link rel="stylesheet" href="{{site.url}}{{site.baseurl}}/assets/css/custom-style.css" /> -->
  <link
    rel="stylesheet"
    href="{{site.url}}{{site.baseurl}}/assets/bower_components/bootstrap/dist/css/bootstrap.min.css"
  />
  <link
    rel="stylesheet"
    href="{{site.url}}{{site.baseurl}}/assets/bower_components/font-awesome/web-fonts-with-css/css/fontawesome-all.min.css"
  />
  <link
    rel="stylesheet"
    href="{{site.url}}{{site.baseurl}}/assets/bower_components/icono/dist/icono.min.css"
  />
  <!-- Fonts-->
  <link
    href="https://fonts.googleapis.com/css?family=Quicksand&display=swap"
    rel="stylesheet"
  />
  <!-- Favicon -->
  <link
    rel="icon"
    href="{{site.url}}{{site.baseurl}}/assets/img/favicon.ico"
    type="image/x-icon"
    sizes="any"
  />
  <link
    rel="apple-touch-icon"
    href="{{site.url}}{{site.baseurl}}/assets/img/avatar.png"
  />
  <script>
      var base_url = '{{ site.url}}{{site.baseurl}}' ;
   </script>

  <!-- Theme switcher: loaded early so cycleTheme() is defined before the header is clickable and to avoid a theme flash on load -->
  <script src="{{site.url}}{{site.baseurl}}/assets/js/mode-switcher.js?v={{ site.time | date: '%s' }}"></script>

  <!-- Jquery -->
  <script
    src="https://code.jquery.com/jquery-3.4.1.min.js"
    integrity="sha384-vk5WoKIaW/vJyUAd9n/wmopsmNhiy+L2Z+SBxGYnUkunIxVxAv/UtMOhba/xskxh"
    crossorigin="anonymous"
  ></script>
  <!-- <script src="{{site.url}}{{site.baseurl}}/assets/bower_components/jquery/dist/jquery.min.js"></script> -->
  <script src="{{site.url}}{{site.baseurl}}/assets/bower_components/jquery.easing/jquery.easing.min.js"></script>
  <script src="{{site.url}}{{site.baseurl}}/assets/bower_components/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{site.url}}{{site.baseurl}}/assets/bower_components/jquery-mousewheel/jquery.mousewheel.min.js"></script>
  <script src="{{site.url}}{{site.baseurl}}/assets/bower_components/ghosthunter/dist/jquery.ghostHunter.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/picturefill/3.0.2/picturefill.min.js"></script>
  <script src="{{site.url}}{{site.baseurl}}/assets/bower_components/nanobar/nanobar.min.js"></script>
  <script src="{{site.url}}{{site.baseurl}}/assets/bower_components/typewrite/dist/typewrite.min.js"></script>
  <script src="{{site.url}}{{site.baseurl}}/assets/js/search.js"></script>
  <script src="{{site.url}}{{site.baseurl}}/assets/js/on-scroll-progress.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.20.1/moment.min.js"></script>

  <!-- Consent defaults must be set before any Google tag loads. Visitors from the EEA, UK and Switzerland start
       denied and see Google's consent banner (AdSense > Privacy & messaging), which updates these signals itself.
       Everyone else gets no banner, so they start granted. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments) }

    gtag('consent', 'default', {
      'ad_storage': 'granted',
      'ad_user_data': 'granted',
      'ad_personalization': 'granted',
      'analytics_storage': 'granted'
    });

    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'wait_for_update': 500,
      'region': ['AT', 'BE', 'BG', 'HR', 'CY', 'CZ', 'DK', 'EE', 'FI', 'FR', 'DE', 'GR', 'HU', 'IS', 'IE', 'IT', 'LV',
                 'LI', 'LT', 'LU', 'MT', 'NL', 'NO', 'PL', 'PT', 'RO', 'SK', 'SI', 'ES', 'SE', 'GB', 'CH']
    });
  </script>

  <!-- Google AdSense: also serves the Google consent banner. Ads only show if Auto ads or ad units are enabled. -->
  {% if site.google_adsense %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.google_adsense }}" crossorigin="anonymous"></script>
  {% endif %}

  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}

  <!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
  <!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
  <!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
  <!--[if gt IE 8]><!--> <html class="no-js"> <!--<![endif]-->
</head>
